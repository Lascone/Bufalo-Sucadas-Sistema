name: Release Desktop

# Desativado: billing/Actions sem cota no plano atual.
# Use em vez disso (local, grátis se GH Releases tiver espaço):
#   pwsh ./scripts/release-desktop.ps1
#
# Para reativar CI no futuro, troque workflow_dispatch pelo trigger de tags v*.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @ferrogestor/shared build

      - name: Build desktop
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm build
          pnpm exec electron-builder --win nsis --publish always

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bufalo-sucata-gestor-windows
          path: apps/desktop/release/*
