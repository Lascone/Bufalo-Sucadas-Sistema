services:
  postgres:
    image: postgres:16-alpine
    container_name: ferrogestor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ferrogestor
      POSTGRES_PASSWORD: ferrogestor
      POSTGRES_DB: ferrogestor
    ports:
      - "5432:5432"
    volumes:
      - ferrogestor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferrogestor -d ferrogestor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ferrogestor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ferrogestor_redis:/data
    profiles:
      - with-redis

volumes:
  ferrogestor_pgdata:
  ferrogestor_redis:
