services:
  # Este projeto NÃO depende de Docker para funcionar.
  # O FerroGestor usa SQLite local (desktop + API de sync).
  # Internet caída: o desktop continua operando normalmente.
  #
  # Redis permanece opcional e desligado por padrão.
  redis:
    image: redis:7-alpine
    container_name: ferrogestor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ferrogestor_redis:/data
    profiles:
      - with-redis

volumes:
  ferrogestor_redis:
